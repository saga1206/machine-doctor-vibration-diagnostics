<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Machine Doctor{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b1014;
        --panel: #141b21;
        --panel-border: #232d35;
        --text-primary: #e8edef;
        --text-muted: #8a97a1;
        --accent: #4fd1c5;
        --accent-dim: #2c7a72;
        --healthy: #34d399;
        --watch: #f5b942;
        --warning: #f2626b;
        --font-display: 'Space Grotesk', sans-serif;
        --font-body: 'IBM Plex Sans', sans-serif;
        --font-mono: 'IBM Plex Mono', monospace;
        --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-body);
        margin: 0;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    h1, h2, h3 {
        font-family: var(--font-display);
        font-weight: 600;
        margin: 0 0 8px 0;
        letter-spacing: -0.01em;
    }

    .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .mono { font-family: var(--font-mono); }

    /* --- Top nav --- */
    .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        border-bottom: 1px solid var(--panel-border);
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        color: var(--text-primary);
    }
    .brand:hover { text-decoration: none; }
    .brand svg { display: block; }
    .nav-links a {
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.82rem;
        margin-left: 22px;
        letter-spacing: 0.02em;
    }
    .nav-links a:hover { color: var(--accent); text-decoration: none; }

    .page {
        max-width: 780px;
        margin: 0 auto;
        padding: 40px 24px 80px;
    }

    /* --- Cards / panels --- */
    .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 20px 22px;
    }

    /* --- Buttons --- */
    button, .btn {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        background: var(--accent);
        color: #06201d;
        border: none;
        padding: 10px 18px;
        border-radius: 7px;
        cursor: pointer;
        font-weight: 600;
    }
    button:hover, .btn:hover { background: #6be0d5; text-decoration: none; }
    button.secondary, .btn.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent-dim);
    }
    button.secondary:hover, .btn.secondary:hover { background: rgba(79,209,197,0.08); }

    /* --- Form fields --- */
    input[type="text"], input[type="file"], select, textarea {
        font-family: var(--font-body);
        background: #0e1418;
        border: 1px solid var(--panel-border);
        color: var(--text-primary);
        padding: 9px 12px;
        border-radius: 7px;
        width: 100%;
    }
    label {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
        display: block;
        margin-bottom: 6px;
    }

    /* --- Health waveform badge (the signature element) --- */
    .health-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 5px 12px 5px 8px;
        border-radius: 20px;
    }
    .health-badge.healthy { background: rgba(52,211,153,0.12); color: var(--healthy); }
    .health-badge.watch   { background: rgba(245,185,66,0.12); color: var(--watch); }
    .health-badge.warning { background: rgba(242,98,107,0.12); color: var(--warning); }
    .health-badge.pending { background: rgba(138,151,161,0.12); color: var(--text-muted); }

    hr.divider {
        border: none;
        border-top: 1px solid var(--panel-border);
        margin: 28px 0;
    }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
    <div class="topnav">
        <a href="{% url 'dashboard' %}" class="brand">
            <svg width="26" height="20" viewBox="0 0 26 20" fill="none">
                <path d="M0 10 H6 L9 2 L13 18 L16 6 L18 14 L20 10 H26" stroke="#4fd1c5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            MACHINE DOCTOR
        </a>
        <div class="nav-links">
            <a href="{% url 'dashboard' %}">DASHBOARD</a>
            <a href="{% url 'upload' %}">NEW SCAN</a>
        </div>
    </div>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
